  <style>
/* ============================================
   Roman Dubensky — Portfolio
   Type: Space Grotesk (400/500/700)
   ============================================ */

:root {
  --paper: #FAFAF8;
  --paper-2: #F0EFEB;
  --ink: #111111;
  --ink-2: #1a1a1a;
  --muted: #6f6a62;
  --line: rgba(17, 17, 17, 0.12);
  --line-strong: rgba(17, 17, 17, 0.22);
  --accent: oklch(0.67 0.28 46);
  --accent-deep: oklch(0.52 0.24 42);
  --gutter: clamp(20px, 4vw, 56px);
  --maxw: 1440px;
  --ease: cubic-bezier(0.7, 0, 0.2, 1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
  font-weight: 500;
  font-feature-settings: "ss01", "ss02";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body {
  overflow-x: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font-family: inherit;
  border: 0;
  background: none;
  cursor: pointer;
  color: inherit;
}

/* ============= Layout ============= */

.shell {
  max-width: var(--maxw);
  margin: 0 auto;
  padding-inline: var(--gutter);
}

/* ============= Nav ============= */

.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
  background: rgba(250, 250, 248, 0.88);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--line);
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 68px;
}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  letter-spacing: -0.01em;
  font-size: 18px;
}
.nav-logo .dot {
  width: 10px; height: 10px;
  background: var(--ink);
  border-radius: 50%;
  display: inline-block;
}
.nav-links {
  display: flex;
  gap: 28px;
  font-size: 14px;
  font-weight: 500;
}
.nav-links a {
  position: relative;
  padding: 12px 4px;
}
.nav-links a::after {
  content: "";
  position: absolute;
  left: 0; right: 100%;
  bottom: 2px;
  height: 1.5px;
  background: var(--ink);
  transition: right 0.4s var(--ease);
}
.nav-links a:hover::after { right: 0; }

.nav-cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  padding: 10px 18px;
  border: 1.5px solid var(--ink);
  border-radius: 999px;
  transition: background 0.3s var(--ease), color 0.3s var(--ease);
}
.nav-cta:hover { background: var(--ink); color: var(--paper); }
.nav-cta .arrow { transition: transform 0.3s var(--ease); }
.nav-cta:hover .arrow { transform: translate(2px, -2px); }

.nav-mobile-cta { display: none; }
.nav-backdrop {
  position: fixed;
  inset: 0;
  top: 68px;
  z-index: 48;
  background: oklch(0.08 0.01 46 / 0.45);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.nav-toggle {
  display: none;
  width: 44px;
  height: 44px;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  flex-shrink: 0;
  transition: background 0.2s var(--ease), color 0.2s var(--ease);
}
.nav-toggle:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

@media (max-width: 720px) {
  .nav-links {
    display: none;
    flex-direction: column;
    position: fixed;
    top: 68px; left: 0; right: 0;
    background: var(--paper);
    padding: 8px var(--gutter) 24px;
    gap: 0;
    z-index: 49;
    border-bottom: 1px solid var(--line);
  }
  .nav-links.is-open { display: flex; }
  .nav-links a {
    padding: 14px 0;
    font-size: 20px;
    font-weight: 600;
    border-bottom: 1px solid var(--line);
    letter-spacing: -0.01em;
  }
  .nav-links a:last-child { border-bottom: none; }
  .nav-links a::after { display: none; }
  .nav-cta { display: none; }
  .nav-toggle { display: flex; }
  .nav-mobile-cta { display: block; }
}

/* ============= Hero ============= */

.hero {
  padding-top: calc(68px + 80px);
  padding-bottom: 80px;
  position: relative;
}
.hero-eyebrow {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 36px;
}
.hero-eyebrow .pulse {
  position: relative;
  width: 8px; height: 8px;
  background: oklch(0.7 0.15 145);
  border-radius: 50%;
}
.hero-eyebrow .pulse::after {
  content: ""; position: absolute; inset: -4px;
  border-radius: 50%;
  background: oklch(0.7 0.15 145 / 0.4);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.6); opacity: 0; }
}

.hero h1 {
  font-size: clamp(56px, min(12vw, 16vh), 200px);
  font-weight: 700;
  line-height: 0.82;
  letter-spacing: -0.04em;
  margin: 0;
  text-wrap: balance;
}
.hero h1 .line {
  display: block;
  overflow: hidden;
  contain: paint;
  padding-bottom: 0.14em;
}
.accent-word {
  color: var(--accent);
  font-style: normal;
}

.hero h1 .line > span {
  display: inline-block;
  transform: translateY(110%);
  animation: rise 0.9s var(--ease) forwards;
  padding-bottom: 0.02em;
}
.hero h1 .line:nth-child(2) > span { animation-delay: 0.08s; }
.hero h1 .line:nth-child(3) > span { animation-delay: 0.16s; }

@keyframes rise {
  to { transform: translateY(0); }
}

.hero-meta {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 40px;
  margin-top: 56px;
  padding-top: 28px;
  border-top: 1px solid var(--line);
  align-items: end;
}
.hero-tag {
  font-size: 18px;
  max-width: 480px;
  line-height: 1.4;
  color: var(--ink-2);
}
.hero-loc {
  font-size: 13px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--muted);
  text-align: right;
}
.hero-loc strong { color: var(--ink); display: block; font-size: 15px; margin-bottom: 4px; }

@media (max-width: 640px) {
  .hero-meta { grid-template-columns: 1fr; }
  .hero-loc { text-align: left; }
}

/* ============= Section header ============= */

.section {
  padding-block: clamp(80px, 12vw, 160px);
  border-top: 1px solid var(--line);
}
.section-head {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 40px;
  margin-bottom: 64px;
  align-items: baseline;
}
.section-num {
  font-size: 13px;
  letter-spacing: 0.06em;
  font-weight: 700;
  color: var(--muted);
}
.section-title {
  font-size: clamp(36px, 6vw, 72px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 0.95;
  margin: 0;
  text-wrap: balance;
}
@media (max-width: 720px) {
  .section-head { grid-template-columns: 1fr; gap: 12px; }
  .section-head::before, .section-head::after { display: none; }
}

/* ============= About ============= */

.about {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 64px;
  align-items: start;
}

.about-byline {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-bottom: 24px;
  margin-bottom: 28px;
  border-bottom: 1px solid var(--line);
}
.about-avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
  background: var(--paper-2);
  border: 1px solid var(--line);
}
.about-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 22%;
  display: block;
}
.about-byline-text {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
}
.about-byline-text strong {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.005em;
}
.about-byline-text span {
  font-size: 13px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  margin-top: 4px;
}

.about-bio {
  font-size: 22px;
  line-height: 1.35;
  font-weight: 500;
  letter-spacing: -0.01em;
  text-wrap: pretty;
}
.about-bio p + p { margin-top: 18px; }
.about-bio strong { font-weight: 700; }

.about-meta {
  display: flex;
  flex-direction: column;
  gap: 28px;
  font-size: 14px;
  padding-top: 4px;
}
.about-meta dl {
  margin: 0;
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
}
.about-meta dt {
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
.about-meta dd {
  margin: 0;
  font-weight: 500;
  font-size: 15px;
  line-height: 1.45;
}

@media (max-width: 800px) {
  .about { grid-template-columns: 1fr; gap: 40px; }
  .about-meta { flex-direction: row; flex-wrap: wrap; gap: 20px 40px; }
  .about-meta dl { flex: 1 1 200px; }
}
@media (max-width: 560px) {
  .about-bio { font-size: 20px; }
}

/* ============= Work / Cases ============= */

.case-cards {
  display: grid;
  gap: 32px;
}

.case-card {
  position: relative;
  isolation: isolate;
  background: #0e0e0e;
  color: var(--paper);
  border-radius: 28px;
  padding: clamp(32px, 5vw, 64px);
  min-height: 0;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 32px;
  cursor: pointer;
  overflow: hidden;
  opacity: 0;
  transform: translateY(60px);
  transition:
    opacity 0.9s var(--ease),
    transform 0.9s var(--ease),
    box-shadow 0.5s var(--ease);
  transition-delay: calc(var(--i, 0) * 0.08s);
}
.case-card.is-visible {
  opacity: 1;
  transform: translateY(0);
}
.case-card.is-soon {
  cursor: default;
  background: #141414;
}
.case-card:not(.is-soon):hover {
  box-shadow: 0 24px 60px -20px rgba(0,0,0,0.45);
}
.case-card:not(.is-soon):hover .case-card-cta {
  background: var(--paper);
  color: var(--ink);
}
.case-card:not(.is-soon):hover .case-card-cta svg { transform: translate(2px, -2px); }
.case-card:not(.is-soon):hover .case-card-glow {
  transform: scale(1.15);
  opacity: 0.55;
}
.case-card-content {
  position: relative;
  z-index: 1;
  padding: clamp(32px, 5vw, 64px);
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 32px;
}

.case-card-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}
.case-card-glow {
  position: absolute;
  right: -5%;
  top: -40%;
  width: 340px;
  height: 340px;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.5;
  pointer-events: none;
  transition: transform 0.7s var(--ease), opacity 0.5s var(--ease);
  will-change: transform, opacity;
}
.case-card.is-soon .case-card-glow { opacity: 0.15; }

.case-card > * { position: relative; z-index: 1; }

.case-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 700;
  color: rgba(241,238,232,0.55);
}
.case-card-top .crumb { display: flex; gap: 14px; align-items: center; }
.case-card-top .crumb b { color: var(--paper); }

.case-card-top .badge {
  padding: 8px 14px;
  border: 1px solid rgba(241,238,232,0.22);
  border-radius: 999px;
  font-size: 12px;
  letter-spacing: 0.06em;
  font-weight: 700;
  color: var(--paper);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.case-card-top .badge.soon { color: rgba(241,238,232,0.65); }
.case-card-top .badge.soon .dot,
.case-card-top .badge.active .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.case-card-top .badge.soon .dot { background: oklch(0.75 0.14 90); }
.case-card-top .badge.active { color: rgba(241,238,232,0.65); }
.case-card-top .badge.active .dot { background: oklch(0.72 0.18 145); }

.case-card-title {
  margin: 0;
  font-size: clamp(40px, 11vw, 180px);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.84;
  display: flex;
  flex-direction: column;
  align-self: center;
}
.case-card-title .bright { color: var(--paper); padding-bottom: 0.04em; }
.case-card-title .dim { color: rgba(241,238,232,0.22); padding-bottom: 0.06em; }
.case-card.is-soon .case-card-title .bright { color: rgba(241,238,232,0.65); }

.case-card-bottom {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 40px;
  align-items: end;
  padding-top: 32px;
  border-top: 1px solid rgba(241,238,232,0.16);
}
.case-card-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}
.case-card-pills .pill {
  padding: 9px 16px;
  border: 1px solid rgba(241,238,232,0.22);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;
}
.case-card-brief {
  margin: 0;
  font-size: 17px;
  line-height: 1.5;
  color: rgba(241,238,232,0.78);
  font-weight: 500;
  max-width: 100%;
}
.case-card-brief .star {
  color: var(--paper);
  margin-right: 6px;
}

.case-card-cta {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 16px 24px;
  border: 1.5px solid rgba(241,238,232,0.4);
  border-radius: 999px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.02em;
  transition: background 0.4s var(--ease), color 0.4s var(--ease);
  white-space: nowrap;
}
.case-card-cta svg { transition: transform 0.4s var(--ease); }
.case-card.is-soon .case-card-cta {
  border-color: rgba(241,238,232,0.18);
  color: rgba(241,238,232,0.5);
}

@media (max-width: 800px) {
  .case-card-content { padding: 28px; gap: 16px; grid-template-rows: auto auto auto; }
  .case-card-bottom { grid-template-columns: 1fr; gap: 20px; }
  .case-card-bottom { grid-template-columns: 1fr; gap: 16px; }
  .case-card-cta { align-self: start; justify-self: center; width: 100%; text-align: center; justify-content: center; }
}

/* ----- Phone peek on case card ----- */
.case-card-screens {
  position: absolute;
  right: 0;
  top: 0;
  width: 44%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}
.case-card-screens img {
  position: absolute;
  height: auto;
  width: 30%;
  filter: drop-shadow(0 30px 50px rgba(0,0,0,0.55));
  transition: transform 0.7s var(--ease);
  top: 50%;
}
.case-card-screens img:nth-child(1) {
  right: 4%;
  width: 28%;
  transform: translateY(-50%) rotate(7deg) translate(0, 4%);
  z-index: 2;
}
.case-card-screens img:nth-child(2) {
  right: 26%;
  width: 32%;
  transform: translateY(-50%) rotate(-2deg);
  z-index: 3;
}
.case-card-screens img:nth-child(3) {
  right: 50%;
  width: 28%;
  transform: translateY(-50%) rotate(-12deg) translate(0, -2%);
  z-index: 1;
  opacity: 0.92;
}
.case-card:hover .case-card-screens img:nth-child(1) {
  transform: translateY(-50%) rotate(9deg) translate(-8px, 2%);
}
.case-card:hover .case-card-screens img:nth-child(2) {
  transform: translateY(-50%) rotate(-3deg) translate(0, -10px);
}
.case-card:hover .case-card-screens img:nth-child(3) {
  transform: translateY(-50%) rotate(-14deg) translate(8px, -5%);
}

/* Make sure card content stays above phones */
.case-card > .case-card-top,
.case-card > .case-card-title,
.case-card > .case-card-bottom {
  z-index: 4;
}

/* Constrain title width so it doesn't overlap phones */
.case-card-screens ~ .case-card-title,
.case-card:has(.case-card-screens) .case-card-title {
  max-width: 58%;
}

@media (max-width: 900px) {
  .case-card-screens { display: none; }
  .case-card:has(.case-card-screens) .case-card-title { max-width: 100%; }
}

/* ============= Case fullscreen overlay ============= */

.case-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--ink);
  color: var(--paper);
  overflow-y: auto;
  overflow-x: hidden;
  /* initial state set in JS for flip animation, fallback below */
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s var(--ease);
}
.case-overlay.is-open {
  opacity: 1;
  pointer-events: auto;
}
.case-overlay::-webkit-scrollbar { width: 0; }

.case-cover {
  min-height: 100vh;
  position: relative;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 40px;
  padding: 96px var(--gutter) 56px;
  max-width: var(--maxw);
  margin: 0 auto;
  width: 100%;
  overflow: hidden;
}

.case-cover-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 700;
  color: rgba(241,238,232,0.55);
}
.case-cover-top .crumb { display: flex; gap: 16px; align-items: center; }
.case-cover-top .crumb b { color: var(--paper); font-weight: 700; }

.case-cover-title {
  margin: 0;
  font-size: clamp(64px, 16vw, 280px);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.86;
  display: flex;
  flex-direction: column;
}
.case-cover-title .bright { color: var(--paper); padding-bottom: 0.02em; }
.case-cover-title .dim { color: rgba(241,238,232,0.28); padding-bottom: 0.04em; }

.case-cover-bottom {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  align-items: end;
  padding-top: 32px;
  border-top: 1px solid rgba(241,238,232,0.18);
}

.case-cover-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.case-cover-pills .pill {
  padding: 10px 18px;
  border: 1px solid rgba(241,238,232,0.22);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--paper);
}

.case-cover-brief {
  font-size: 18px;
  line-height: 1.45;
  color: rgba(241,238,232,0.85);
  font-weight: 500;
  max-width: 520px;
  position: relative;
  padding-left: 32px;
}
.case-cover-brief::before {
  content: "✦";
  position: absolute;
  left: 0; top: 2px;
  color: var(--paper);
  font-size: 18px;
}

.case-cover-meta {
  display: grid;
  grid-template-columns: auto auto auto;
  gap: 32px 56px;
  font-size: 13px;
  justify-content: end;
  align-items: start;
}
.case-cover-meta dt {
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(241,238,232,0.5);
  font-weight: 600;
  margin-bottom: 8px;
}
.case-cover-meta dd { margin: 0; font-size: 15px; font-weight: 500; color: var(--paper); white-space: nowrap; }

@media (max-width: 800px) {
  .case-cover { padding: 80px var(--gutter) 40px; gap: 32px; }
  .case-cover-bottom { grid-template-columns: 1fr; gap: 28px; }
  .case-cover-meta { justify-content: start; grid-template-columns: 1fr 1fr; gap: 24px; }
  .case-cover-meta dd { white-space: normal; }
}
@media (max-width: 560px) {
  .case-cover-top .crumb { gap: 8px; }
}

.case-close {
  position: fixed;
  top: 24px; right: 24px;
  z-index: 110;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--paper);
  color: var(--ink);
  display: grid;
  place-items: center;
  transition: transform 0.4s var(--ease);
}
.case-close:hover { transform: rotate(90deg); }

.case-body {
  padding: 40px var(--gutter) 120px;
  max-width: var(--maxw);
  margin: 0 auto;
  border-top: 1px solid rgba(241,238,232,0.12);
}

/* ============= Case hero image ============= */
.case-hero-img {
  margin: 24px 0 56px;
  position: relative;
  border-radius: 28px;
  overflow: hidden;
  background: #0a0a0a;
}
.case-hero-img img {
  width: 100%;
  height: auto;
  display: block;
}
.case-hero-img figcaption {
  position: absolute;
  bottom: 16px;
  left: 24px;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(241,238,232,0.45);
  pointer-events: none;
}
@media (max-width: 720px) {
  .case-hero-img { border-radius: 18px; margin-bottom: 40px; }
  .case-hero-img figcaption { left: 16px; font-size: 10px; }
}

/* ============= Case stats row ============= */
.case-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid rgba(241,238,232,0.15);
  border-bottom: 1px solid rgba(241,238,232,0.15);
  margin-top: 8px;
  margin-bottom: 80px;
}
.case-stat {
  padding: 32px 28px;
  border-right: 1px solid rgba(241,238,232,0.15);
}
.case-stat:last-child { border-right: 0; }
.case-stat-val {
  font-size: clamp(28px, 3vw, 40px);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
  color: var(--paper);
}
.case-stat-label {
  margin-top: 12px;
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(241,238,232,0.5);
  font-weight: 600;
}
@media (max-width: 720px) {
  .case-stats { grid-template-columns: 1fr 1fr; }
  .case-stat:nth-child(2n) { border-right: 0; }
  .case-stat:nth-child(-n+2) { border-bottom: 1px solid rgba(241,238,232,0.15); }
}

/* ============= Rich case sections ============= */

.case-section-rich {
  padding-block: 64px;
  border-top: 1px solid rgba(241,238,232,0.12);
}
.case-section-rich:first-of-type { border-top: 0; padding-top: 0; }

.case-section-head {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 40px;
  margin-bottom: 48px;
  align-items: baseline;
}
.case-section-num {
  font-size: 13px;
  letter-spacing: 0.06em;
  font-weight: 700;
  color: rgba(241,238,232,0.5);
  text-transform: uppercase;
}
.case-section-title {
  font-size: clamp(32px, 4.5vw, 56px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
  margin: 0;
  color: var(--paper);
  text-wrap: balance;
}

.case-section-body {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 40px;
  align-items: start;
}
.case-section-body > * { grid-column: 2; }
.case-section-body > .scenes { grid-column: 1 / -1; }
.case-section-body > p {
  font-size: 18px;
  line-height: 1.55;
  color: rgba(241,238,232,0.78);
  margin: 0 0 16px;
  max-width: 720px;
  text-wrap: pretty;
}
.case-section-body > p:last-child { margin-bottom: 0; }

@media (max-width: 800px) {
  .case-section-head,
  .case-section-body { grid-template-columns: 1fr; gap: 16px; }
  .case-section-body > * { grid-column: 1; }
}

/* ============= Role cards ============= */
.role-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-top: 32px;
}
.role-card {
  background: rgba(241,238,232,0.04);
  border: 1px solid rgba(241,238,232,0.1);
  border-radius: 16px;
  padding: 24px;
}
.role-num {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(241,238,232,0.45);
  margin-bottom: 14px;
}
.role-card h4 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0 0 10px;
  color: var(--paper);
}
.role-card p {
  font-size: 14px;
  line-height: 1.5;
  color: rgba(241,238,232,0.65);
  margin: 0 0 16px;
}
.role-access {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid;
}
.access-full { color: oklch(0.78 0.14 145); border-color: oklch(0.78 0.14 145 / 0.4); background: oklch(0.78 0.14 145 / 0.08); }
.access-mid { color: oklch(0.78 0.12 220); border-color: oklch(0.78 0.12 220 / 0.4); background: oklch(0.78 0.12 220 / 0.08); }
.access-limited { color: oklch(0.72 0.16 28); border-color: oklch(0.72 0.16 28 / 0.4); background: oklch(0.72 0.16 28 / 0.08); }
@media (max-width: 800px) { .role-grid { grid-template-columns: 1fr; } }

/* ============= Challenges ============= */
.challenge-stack {
  display: flex;
  flex-direction: column;
  gap: 1px;
  margin-top: 24px;
  border-radius: 16px;
  overflow: hidden;
}
.challenge-card {
  display: grid;
  grid-template-columns: 40px 1fr;
  gap: 20px;
  padding: 22px 24px;
  background: rgba(241,238,232,0.04);
  align-items: start;
}
.challenge-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: oklch(0.55 0.20 20 / 0.12);
  border: 1px solid oklch(0.55 0.20 20 / 0.30);
  color: oklch(0.72 0.18 20);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.challenge-card h4 {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.005em;
  margin: 0 0 6px;
  color: var(--paper);
}
.challenge-card p {
  font-size: 14px;
  line-height: 1.55;
  color: rgba(241,238,232,0.65);
  margin: 0;
}

.constraint-card {
  margin-top: 24px;
  padding: 24px;
  background: oklch(0.72 0.16 28 / 0.06);
  border: 1px solid oklch(0.72 0.16 28 / 0.25);
  border-radius: 16px;
}
.constraint-label {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: oklch(0.78 0.16 28);
  margin-bottom: 10px;
}
.constraint-card p {
  margin: 0;
  font-size: 15px;
  line-height: 1.55;
  color: rgba(241,238,232,0.85);
}

/* ============= Insight ============= */
.insight-card {
  margin-top: 24px;
  padding: 28px;
  border-radius: 16px;
  background: linear-gradient(135deg, oklch(0.78 0.14 145 / 0.08), oklch(0.78 0.14 145 / 0.02));
  border: 1px solid oklch(0.78 0.14 145 / 0.25);
  position: relative;
  overflow: hidden;
}
.insight-card::before {
  content: "“";
  position: absolute;
  right: 20px;
  top: -30px;
  font-size: 180px;
  line-height: 1;
  font-weight: 700;
  color: oklch(0.78 0.14 145 / 0.08);
}
.insight-label {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: oklch(0.78 0.14 145);
  margin-bottom: 10px;
}
.insight-card p {
  margin: 0;
  font-size: 18px;
  line-height: 1.5;
  color: var(--paper);
  position: relative;
}

/* ============= Process ============= */
.process-list {
  display: flex;
  flex-direction: column;
  border-top: 1px solid rgba(241,238,232,0.12);
  margin-top: 16px;
}
.process-row {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 24px;
  padding: 24px 0;
  border-bottom: 1px solid rgba(241,238,232,0.12);
  align-items: baseline;
}
.process-num {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 22px;
  font-weight: 500;
  color: rgba(241,238,232,0.3);
  letter-spacing: 0.04em;
}
.process-text h4 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0 0 6px;
  color: var(--paper);
}
.process-text p {
  font-size: 14px;
  line-height: 1.55;
  color: rgba(241,238,232,0.65);
  margin: 0;
}
@media (max-width: 600px) {
  .process-row { grid-template-columns: 1fr; gap: 4px; }
}

/* ============= Feature cards ============= */
.feature-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin-top: 8px;
}
.feature-card {
  padding: 28px;
  border-radius: 16px;
  background: rgba(241,238,232,0.04);
  border: 1px solid rgba(241,238,232,0.1);
}
.feature-card.kind-unique {
  background: linear-gradient(135deg, oklch(0.78 0.14 145 / 0.08), rgba(241,238,232,0.02));
  border-color: oklch(0.78 0.14 145 / 0.28);
}
.feature-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 4px;
  background: rgba(241,238,232,0.08);
  color: rgba(241,238,232,0.7);
  margin-bottom: 14px;
}
.kind-unique .feature-badge {
  background: oklch(0.78 0.14 145 / 0.12);
  color: oklch(0.78 0.14 145);
}
.feature-card h4 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0 0 8px;
  color: var(--paper);
}
.feature-card p {
  font-size: 14px;
  line-height: 1.55;
  color: rgba(241,238,232,0.65);
  margin: 0;
}
@media (max-width: 720px) { .feature-grid { grid-template-columns: 1fr; } }

/* ============= Status & Results ============= */
.status-card {
  display: grid;
  grid-template-columns: 14px 1fr;
  gap: 16px;
  align-items: start;
  padding: 24px;
  background: rgba(241,238,232,0.04);
  border: 1px solid rgba(241,238,232,0.1);
  border-radius: 16px;
  margin-bottom: 32px;
}
.status-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: oklch(0.75 0.18 145);
  box-shadow: 0 0 0 0 oklch(0.75 0.18 145 / 0.5);
  animation: statusPulse 2s ease-in-out infinite;
  margin-top: 6px;
}
@keyframes statusPulse {
  0%, 100% { box-shadow: 0 0 0 0 oklch(0.75 0.18 145 / 0.5); }
  50% { box-shadow: 0 0 0 8px oklch(0.75 0.18 145 / 0); }
}
.status-card p {
  margin: 0;
  font-size: 15px;
  line-height: 1.55;
  color: rgba(241,238,232,0.85);
}

.results-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
.result-card {
  padding: 24px;
  background: rgba(241,238,232,0.04);
  border: 1px solid rgba(241,238,232,0.1);
  border-radius: 16px;
}
.result-icon {
  display: inline-grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: oklch(0.78 0.14 145 / 0.1);
  border: 1px solid oklch(0.78 0.14 145 / 0.25);
  color: oklch(0.82 0.14 145);
  margin-bottom: 14px;
}
.result-card h4 {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.005em;
  margin: 0 0 6px;
  color: var(--paper);
}
.result-card p {
  font-size: 14px;
  line-height: 1.55;
  color: rgba(241,238,232,0.65);
  margin: 0;
}
@media (max-width: 720px) { .results-grid { grid-template-columns: 1fr; } }

/* ============= Reflection ============= */
.reflection-quote {
  margin: 32px 0 0;
  padding: 32px;
  background: oklch(0.75 0.14 55 / 0.07);
  border: 1px solid oklch(0.72 0.16 55 / 0.3);
  border-radius: 16px;
  position: relative;
}
.reflection-quote .quote-mark {
  position: absolute;
  top: 0;
  left: 24px;
  font-size: 80px;
  line-height: 1;
  color: oklch(0.72 0.16 55 / 0.25);
  font-weight: 700;
}
.reflection-quote p {
  margin: 24px 0 0;
  font-size: 18px;
  line-height: 1.55;
  color: rgba(241,238,232,0.95);
  font-weight: 500;
  text-wrap: pretty;
}

/* ============= Technical precision layer ============= */

/* Precision crosshair mark */
.precision-mark {
  flex-shrink: 0;
  opacity: 0.5;
  color: var(--muted);
}
.hero-eyebrow .precision-mark {
  opacity: 0.4;
  margin-left: 4px;
}

/* Corner brackets on section headers — engineering drawing register */
.section-head {
  position: relative;
}
.section-head::before,
.section-head::after {
  content: "";
  position: absolute;
  width: 16px;
  height: 16px;
  pointer-events: none;
}
.section-head::before {
  top: 0;
  left: -8px;
  border-top: 1px solid oklch(0.55 0.010 46 / 0.35);
  border-left: 1px solid oklch(0.55 0.010 46 / 0.35);
}
.section-head::after {
  bottom: 0;
  right: -8px;
  border-bottom: 1px solid oklch(0.55 0.010 46 / 0.35);
  border-right: 1px solid oklch(0.55 0.010 46 / 0.35);
}

/* Corner mark on insight card bottom-right */
.insight-card::after {
  content: "";
  position: absolute;
  bottom: 12px;
  right: 12px;
  width: 14px;
  height: 14px;
  border-bottom: 1px solid oklch(0.78 0.14 145 / 0.45);
  border-right: 1px solid oklch(0.78 0.14 145 / 0.45);
  pointer-events: none;
}

/* ============= Skip nav ============= */
.skip-nav {
  position: absolute;
  top: -100%;
  left: 16px;
  z-index: 200;
  padding: 10px 18px;
  background: var(--ink);
  color: var(--paper);
  font-size: 13px;
  font-weight: 600;
  border-radius: 0 0 8px 8px;
  transition: top 0.2s;
}
.skip-nav:focus { top: 0; }

/* ============= Approach list ============= */
.approach-list {
  padding: 0;
  list-style: none;
  margin: 0;
}
.approach-item {
  display: grid;
  grid-template-columns: 40px 1fr;
  gap: 16px;
  padding-block: 14px;
  border-top: 1px solid rgba(241,238,232,0.12);
}
.approach-item:first-child { border-top: 0; }
.approach-num {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 13px;
  color: rgba(241,238,232,0.4);
  padding-top: 6px;
}

/* ============= Role list (replaces role-grid) ============= */
.role-list {
  margin-top: 32px;
  border-top: 1px solid rgba(241,238,232,0.1);
}
.role-row {
  display: grid;
  grid-template-columns: 36px 1fr auto;
  gap: 24px;
  padding: 22px 0;
  border-bottom: 1px solid rgba(241,238,232,0.1);
  align-items: center;
}
.role-row-num {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 12px;
  color: rgba(241,238,232,0.35);
  letter-spacing: 0.08em;
  padding-top: 2px;
}
.role-row-body h4 {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0 0 4px;
  color: var(--paper);
}
.role-row-body p {
  font-size: 13px;
  line-height: 1.5;
  color: rgba(241,238,232,0.6);
  margin: 0;
  max-width: 400px;
}
@media (max-width: 640px) {
  .role-row { grid-template-columns: 36px 1fr; gap: 16px; }
  .role-row .role-access { grid-column: 2; margin-top: -4px; }
}

/* ============= Results table (replaces results-grid cards) ============= */
.results-table {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  border-top: 1px solid rgba(241,238,232,0.12);
  border-left: 1px solid rgba(241,238,232,0.12);
  margin-top: 16px;
}
.result-cell {
  padding: 24px;
  border-bottom: 1px solid rgba(241,238,232,0.12);
  border-right: 1px solid rgba(241,238,232,0.12);
}
.result-cell-num {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: rgba(241,238,232,0.35);
  margin-bottom: 10px;
}
.result-cell h4 {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0 0 6px;
  color: var(--paper);
}
.result-cell p {
  font-size: 13px;
  line-height: 1.5;
  color: rgba(241,238,232,0.6);
  margin: 0;
}
@media (max-width: 560px) {
  .results-table { grid-template-columns: 1fr; }
}

/* ============= Showcase (tiles only — hero is at top of case-body) ============= */

.case-showcase {
  margin-block: 32px 0;
}

/* Horizontal scroll strip */
.showcase-scroll {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  scroll-snap-type: none;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 12px;
  margin-inline: calc(-1 * var(--gutter));
  padding-inline: var(--gutter);
  cursor: grab;
  user-select: none;
}
.showcase-scroll::-webkit-scrollbar { display: none; }
.showcase-scroll.is-dragging { cursor: grabbing; scroll-snap-type: none; }

.showcase-slide {
  margin: 0;
  flex: 0 0 auto;
  height: clamp(320px, 45vw, 600px);
  width: auto;
  border-radius: 14px;
  overflow: hidden;
  background: #0a0a0a;
  pointer-events: none;
}
.showcase-scroll.is-dragging .showcase-slide { pointer-events: none; }
.showcase-slide img {
  height: 100%;
  width: auto;
  display: block;
  object-fit: contain;
  pointer-events: none;
}

/* Drag hint indicator */
.showcase-hint {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 16px;
  margin-bottom: 48px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(241,238,232,0.35);
  font-weight: 600;
  animation: hint-pulse 2s ease-in-out infinite;
  border: none;
  outline: none;
}
.showcase-hint svg {
  opacity: 0.4;
}
@keyframes hint-pulse {
  0%, 100% { color: rgba(241,238,232,0.25); }
  50%       { color: rgba(241,238,232,0.8); }
}

.showcase-wrap {
  position: relative;
}

@media (max-width: 600px) {
  .showcase-scroll { cursor: auto; }
  .showcase-slide { height: clamp(400px, 75vw, 460px); }
}

/* ============= Module scenes (composed phone mockups) ============= */
.scenes {
  display: flex;
  flex-direction: column;
  gap: 32px;
}

.scene {
  position: relative;
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 32px;
  border-radius: 28px;
  background: linear-gradient(160deg,
    color-mix(in oklch, var(--accent, oklch(0.78 0.14 145)) 14%, #141414) 0%,
    #0e0e0e 65%);
  padding: 56px 48px;
  min-height: 540px;
  overflow: hidden;
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.9s var(--ease), transform 0.9s var(--ease);
  isolation: isolate;
}
.scene.is-visible {
  opacity: 1;
  transform: translateY(0);
}
.scene::before {
  /* subtle radial vignette */
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 80% 30%,
    color-mix(in oklch, var(--accent, oklch(0.78 0.14 145)) 18%, transparent) 0%,
    transparent 55%);
  pointer-events: none;
  z-index: 0;
}

.scene-info {
  position: relative;
  z-index: 2;
  align-self: end;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.scene-num {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 12px;
  letter-spacing: 0.1em;
  color: rgba(241,238,232,0.45);
  text-transform: uppercase;
}
.scene-info h3 {
  font-size: clamp(28px, 3.2vw, 44px);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 0.95;
  margin: 0;
  color: var(--paper);
}
.scene-info p {
  font-size: 15px;
  line-height: 1.55;
  color: rgba(241,238,232,0.7);
  margin: 0;
  max-width: 280px;
}

function ShowcaseScroll({ tiles }) {
  const scrollRef = React.useRef(null);
  const [activeIdx, setActiveIdx] = React.useState(0);
  const dragging = React.useRef(false);
  const startX = React.useRef(0);
  const scrollLeft = React.useRef(0);
  const velX = React.useRef(0);
  const lastX = React.useRef(0);
  const rafId = React.useRef(null);

  function onMouseDown(e) {
    if (rafId.current) cancelAnimationFrame(rafId.current);
    dragging.current = true;
    startX.current = e.pageX;
    lastX.current = e.pageX;
    scrollLeft.current = scrollRef.current.scrollLeft;
    velX.current = 0;
    scrollRef.current.classList.add('is-dragging');
    e.preventDefault();
  }
  function onMouseMove(e) {
    if (!dragging.current) return;
    e.preventDefault();
    const dx = e.pageX - startX.current;
    velX.current = e.pageX - lastX.current;
    lastX.current = e.pageX;
    scrollRef.current.scrollLeft = scrollLeft.current - dx;
  }
  function onMouseUp() { endDrag(); }
  function onMouseLeave() { endDrag(); }

  function endDrag() {
    if (!dragging.current) return;
    dragging.current = false;
    scrollRef.current.classList.remove('is-dragging');
    let vel = -velX.current * 1.5;
    function momentum() {
      if (Math.abs(vel) < 0.5) return;
      scrollRef.current.scrollLeft += vel;
      vel *= 0.92;
      rafId.current = requestAnimationFrame(momentum);
    }
    rafId.current = requestAnimationFrame(momentum);
  }

  React.useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    function onScroll() {
      const slideW = el.scrollWidth / tiles.length;
      setActiveIdx(Math.round(el.scrollLeft / slideW));
    }
    el.addEventListener('scroll', onScroll, { passive: true });
    return () => el.removeEventListener('scroll', onScroll);

function ModuleScene({ group, index, accent }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            setVisible(true);
            io.disconnect();
          }
        });
      },
      { threshold: 0.1 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);

  const count = group.screens.length;
  const layout = "scene-layout-" + Math.min(count, 4);

  return (
    <section
      ref={ref}
      className={"scene " + layout + (visible ? " is-visible" : "")}
      style={{ "--accent": accent, "--si": index }}
    >
      <div className="scene-info">
        <span className="scene-num">{String(index + 1).padStart(2, "0")} / 07</span>
        <h3>{group.label}</h3>
        <p>{group.note}</p>

      <div className="scene-stage" aria-hidden="false">
        <span className="scene-bg-text">
          {group.label.split(/\s+/).map((w, i) => (
            <span key={i} className="scene-bg-word">{w}</span>

        <div className="scene-phones">

        </div>
      </div>
    </section>
  );
}

/* ============= Case overlay ============= */

function CaseOverlay({ caseData, originRect, onClose, onNext }) {
  const overlayRef = useRef(null);
  const closeRef = useRef(null);
  const [phase, setPhase] = useState("entering"); // entering -> open -> exiting

  // Focus close button after enter animation completes
  useEffect(() => {
    const t = setTimeout(() => {
      if (closeRef.current) closeRef.current.focus();
    }, 800);
    return () => clearTimeout(t);
  }, [caseData?.id]);

  // Flip-style animation: start as a tiny rect at originRect, then expand to full viewport.
  useLayoutEffect(() => {
    if (!caseData || !originRect || !overlayRef.current) return;
    const el = overlayRef.current;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    // initial state mirrors the case row
    const sx = originRect.width / vw;
    const sy = originRect.height / vh;
    const tx = originRect.left;
    const ty = originRect.top;
    el.style.transformOrigin = "top left";
    el.style.transform = `translate(${tx}px, ${ty}px) scale(${sx}, ${sy})`;
    el.style.opacity = "1";
    el.style.borderRadius = "0px";
    // force a frame
    el.getBoundingClientRect();
    requestAnimationFrame(() => {
      el.style.transition = "transform 0.75s cubic-bezier(0.7, 0, 0.2, 1)";
      el.style.transform = "translate(0,0) scale(1,1)";
    });
    const t = setTimeout(() => setPhase("open"), 780);
    return () => clearTimeout(t);
  }, [caseData?.id]);

  useEffect(() => {
    document.body.classList.add("locked");
    const onKey = (e) => { if (e.key === "Escape") handleClose(); };
    window.addEventListener("keydown", onKey);
    return () => {
      document.body.classList.remove("locked");
      window.removeEventListener("keydown", onKey);
    };
  }, []);

  function handleClose() {
    const el = overlayRef.current;
    if (!el || !originRect) { onClose(); return; }
    const vw = window.innerWidth, vh = window.innerHeight;
    const sx = originRect.width / vw;
    const sy = originRect.height / vh;
    el.style.transition = "transform 0.6s cubic-bezier(0.7, 0, 0.2, 1), opacity 0.4s ease 0.2s";
    el.style.transform = `translate(${originRect.left}px, ${originRect.top}px) scale(${sx}, ${sy})`;
    el.style.opacity = "0";
    setPhase("exiting");
    setTimeout(onClose, 620);
  }

  if (!caseData) return null;

  return (
    <div
      ref={overlayRef}
      className="case-overlay is-open"
      role="dialog"
      aria-modal="true"
      aria-label={caseData.title}
      style={{ background: caseData.cover === "warm" ? "#0a0a0a" : "#0a0f12" }}
    >
      <button ref={closeRef} className="case-close" onClick={handleClose} aria-label="Close project">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M4 4 L16 16 M16 4 L4 16" stroke="currentColor" strokeWidth="1.6" />
        </svg>
      </button>

      <header className="case-cover">
        <div className="case-cover-top">
          <span className="crumb">
            <span>Case</span>
            <b>{caseData.num}</b>
            <span>/ {caseData.year}</span>
          </span>
          <span>{caseData.scope}</span>
        </div>

        <h1 className="case-cover-title">
          <span className="bright">{caseData.titleBright}</span>
          <span className="dim">{caseData.titleDim}</span>
        </h1>

        <div className="case-cover-bottom">
          <div>
            <div className="case-cover-pills">
              {caseData.pills.map((p) => (
                <span key={p} className="pill">{p}</span>
              ))}
            </div>
            <p className="case-cover-brief" style={{ marginTop: 28 }}>
              {caseData.brief}
            </p>
          </div>
          <dl className="case-cover-meta">
            <div><dt>Role</dt><dd>{caseData.role}</dd></div>
            <div className="meta-wide"><dt>Scope</dt><dd>{caseData.scope}</dd></div>
            <div><dt>Duration</dt><dd>{caseData.duration}</dd></div>

        </div>
      </header>

      <div className="case-body">

        )}

        {caseData.stats && (

            {caseData.stats.map((s, i) => (

                <div className="case-stat-val">{s.value}</div>

        {caseData.sections ? (

function CaseCard({ c, index, onOpen }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            setVisible(true);
            io.disconnect();
          }
        });
      },
      { threshold: 0.15 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);

  return (
    <article
      ref={ref}
      className={
        "case-card" +
        (visible ? " is-visible" : "") +
        (c.comingSoon ? " is-soon" : "")
      }
      style={{ "--i": index }}
      onClick={c.comingSoon ? undefined : (e) => onOpen(e, c)}
      onKeyDown={c.comingSoon ? undefined : (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onOpen(e, c); }
      }}
      role={c.comingSoon ? undefined : "button"}
      tabIndex={c.comingSoon ? -1 : 0}
    >
      {/* Background layer — contains glow, clipped independently */}
      <div className="case-card-bg" aria-hidden="true">
        <div className="case-card-glow" style={{ background: c.accent }}></div>
      </div>

      {/* Content layer — defines card height */}
      <div className="case-card-content">
        <div className="case-card-top">
          <span className="crumb">
            <span>Case</span>
            <b>{c.num}</b>
            <span>/ {c.year}</span>
          </span>
          {c.comingSoon ? (
            <span className="badge soon">
              <span className="dot"></span>In progress
            </span>
          ) : c.inProgress ? (
            <span className="badge active">
              <span className="dot"></span>In progress
            </span>
          ) : null}
        </div>

        <h3 className="case-card-title">
          <span className="bright">{c.titleBright}</span>
          <span className="dim">{c.titleDim}</span>
        </h3>

        <div className="case-card-bottom">
          <div>
            <div className="case-card-pills">
              {c.pills.map((p) => (
                <span key={p} className="pill">{p}</span>
              ))}
            </div>
            <p className="case-card-brief">
              <span className="star">✦</span> {c.brief}
            </p>
          </div>

          <div className="case-card-cta" aria-hidden="true">
            {c.comingSoon ? (
              <span>Coming soon</span>
            ) : (
              <>
                <span>Open project</span>
                <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                  <path d="M5 17 L17 5 M8 5 H17 V14" stroke="currentColor" strokeWidth="1.7" />
                </svg>
              </>
            )}
          </div>
        </div>
      </div>

    </article>
  );

}

/* ============= Back To Top ============= */

function BackToTop() {
  const [visible, setVisible] = React.useState(false);

  React.useEffect(() => {
    function onScroll() {
      const overlay = document.querySelector('.case-overlay');
      const scrollY = overlay ? overlay.scrollTop : window.scrollY;
      setVisible(scrollY > 400);
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    const mo = new MutationObserver(() => {
      const overlay = document.querySelector('.case-overlay');
      if (overlay) overlay.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    });
    mo.observe(document.body, { childList: true, subtree: false });
    return () => { window.removeEventListener('scroll', onScroll); mo.disconnect(); };
  }, []);

  function handleClick() {
    const overlay = document.querySelector('.case-overlay');
    if (overlay) overlay.scrollTo({ top: 0, behavior: 'smooth' });
    else window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  return (
    <button
      className={`back-to-top${visible ? ' visible' : ''}`}
      onClick={handleClick}
      aria-label="Back to top"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="18 15 12 9 6 15" />
      </svg>
    </button>
  );
}

/* ============= App root ============= */

function App() {
  const [active, setActive] = useState(null); // { caseData, originRect }
  const lastFocusRef = useRef(null);

  function openCase(caseData, originRect, triggerEl) {
    lastFocusRef.current = triggerEl || document.activeElement;
    setActive({ caseData, originRect });
  }
  function closeCase() {
    setActive(null);
    setTimeout(() => {
      if (lastFocusRef.current) lastFocusRef.current.focus();
    }, 650);
  }
  function nextCase() {
    if (!active) return;
    const idx = CASES.findIndex(c => c.id === active.caseData.id);
    const nextC = CASES[(idx + 1) % CASES.length];
    const rect = { left: 0, top: 0, width: window.innerWidth, height: 80 };
    const overlay = document.querySelector(".case-overlay");
    if (overlay) overlay.scrollTop = 0;
    setActive({ caseData: nextC, originRect: rect });
  }

  return (
    <>
      <a href="#main-content" className="skip-nav">Skip to content</a>
      <Nav />
      <main id="main-content">
        <Hero />
        <Marquee />
        <Work onOpen={openCase} />
        <About />
        <Experience />
        <Capabilities />
        <Contact />
      </main>
      <Footer />
      {active && (
        <CaseOverlay
          key={active.caseData.id}
          caseData={active.caseData}
          originRect={active.originRect}
          onClose={closeCase}
          onNext={nextCase}
        />
      )}
      <BackToTop />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
